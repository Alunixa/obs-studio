name: Windows Build
run-name: Windows build (${{ inputs.architecture }}, ${{ inputs.config }}) 🪟

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build
        type: choice
        default: both
        options:
          - both
          - x64
          - arm64
      config:
        description: Build configuration
        type: choice
        default: RelWithDebInfo
        options:
          - RelWithDebInfo
          - Release

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Select Architectures 🔎
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build Matrix
        id: matrix
        env:
          ARCH_INPUT: ${{ inputs.architecture }}
        run: |
          case "${ARCH_INPUT}" in
            x64)   echo 'matrix={"architecture":["x64"]}' >> "$GITHUB_OUTPUT" ;;
            arm64) echo 'matrix={"architecture":["arm64"]}' >> "$GITHUB_OUTPUT" ;;
            *)     echo 'matrix={"architecture":["x64","arm64"]}' >> "$GITHUB_OUTPUT" ;;
          esac

  windows-build:
    name: Windows ${{ matrix.architecture }} 🪟
    needs: setup
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      # OBS derives its CMake version from `git describe`. The fork has no tags,
      # so describe returns a bare hash ("4a16c01ef") and project(VERSION) fails.
      - name: Fetch Version Tags 🏷️
        run: |
          git fetch https://github.com/obsproject/obs-studio.git '+refs/tags/*:refs/tags/*' --no-recurse-submodules || Write-Host "::warning::Could not fetch upstream tags"

          $desc = git describe --always 2>$null
          Write-Host "git describe: $desc"

          if ($desc -notmatch '^\d+\.\d+') {
            Write-Host "::warning::No usable version tag, creating a temporary placeholder tag"
            git tag -f 32.0.0 HEAD
            Write-Host "git describe now: $(git describe --always)"
          }
          exit 0

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        with:
          target: ${{ matrix.architecture }}
          config: ${{ inputs.config }}

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        with:
          target: ${{ matrix.architecture }}
          config: ${{ inputs.config }}
          package: true

      - name: Get Short Commit Hash 🆔
        id: vars
        run: |
          "commitHash=$($env:GITHUB_SHA.Substring(0, 9))" >> $env:GITHUB_OUTPUT

      # Contains the zipped portable build (bin/64bit/obs64.exe inside)
      - name: Upload Windows Package 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-studio-windows-${{ matrix.architecture }}-${{ steps.vars.outputs.commitHash }}
          path: ${{ github.workspace }}/build_${{ matrix.architecture }}/obs-studio-*-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error

      # Unzipped install tree, so you can grab obs64.exe directly
      - name: Upload Unpackaged Build (exe folder) 📂
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-studio-windows-${{ matrix.architecture }}-${{ steps.vars.outputs.commitHash }}-unpacked
          path: ${{ github.workspace }}/build_${{ matrix.architecture }}/rundir/${{ inputs.config }}/
          if-no-files-found: warn
