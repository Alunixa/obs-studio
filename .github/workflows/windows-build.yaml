name: Windows Build

on:
  push:
    branches:
      - feature/disk-replay-buffer
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 🪟
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare version tags
        shell: pwsh
        run: |
          # Pull upstream release tags so git describe has a real version to land on
          git fetch https://github.com/obsproject/obs-studio.git '+refs/tags/*:refs/tags/*' --no-recurse-submodules
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Could not fetch upstream tags" }

          # Remove non-version tags (archive-*, alunixa-*, ...) on the runner only.
          # OBS's CMake uses git describe and fails on tags that aren't X.Y.Z.
          git tag | Where-Object { $_ -notmatch '^\d+\.\d+' } | ForEach-Object { git tag -d $_ }

          $desc = git describe --always 2>$null
          Write-Host "git describe: $desc"

          if ($desc -notmatch '^\d+\.\d+') {
            Write-Host "::warning::No usable version tag, creating a temporary placeholder tag"
            git tag -f 32.0.0 HEAD
            Write-Host "git describe now: $(git describe --always)"
          }
          exit 0

      - name: Build OBS
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo
          codesign: false
          workingDirectory: ${{ github.workspace }}
